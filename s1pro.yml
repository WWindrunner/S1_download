name: s1pro

channels:
  - conda-forge

# Only direct dependencies imported by this project's Python scripts are listed
# here. Conda resolves transitive libraries (PROJ, GEOS, HDF5, etc.) itself.
dependencies:
  - python=3.12

  # Core numerical and data handling
  - numpy=1.26
  - pandas
  - scipy

  # Geospatial stack: keep these in conda-forge to avoid binary ABI conflicts
  - gdal
  - geopandas
  - rasterio
  - shapely
  - matplotlib

  # Sentinel-1 processing and catalogue access
  - pyrosar
  - eodag
  - planetary-computer
  - pystac-client

  # HTTP downloads and command-line progress
  - requests
  - tqdm
  - wget

# ESA SNAP (including the `gpt` executable) is an external application used by
# pyroSAR. Install SNAP separately and ensure its bin directory is on PATH.
